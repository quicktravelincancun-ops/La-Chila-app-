<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a305e" />
      <stop offset="100%" stop-color="#051b36" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a45" />
      <stop offset="100%" stop-color="#f05a28" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Badge with Soft Rounded Corners -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)" />
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="#00aae4" stroke-width="2.5" opacity="0.4" />

  <!-- Orange Speed Arc / Ribbon Accent -->
  <path d="M 16 96 C 45 110, 85 110, 112 92 C 104 88, 60 102, 24 90 Z" fill="url(#orangeGrad)" opacity="0.95" />

  <!-- Stylized Modern Van / Transportation Icon -->
  <g transform="translate(18, 22)" filter="url(#shadow)">
    <!-- Cabin Roof & Windshield -->
    <path d="M 12 40 L 22 20 C 24 16, 28 14, 34 14 L 62 14 C 68 14, 72 16, 76 22 L 80 40 Z" fill="#00aae4" opacity="0.9" />
    <!-- Windshield Glass -->
    <path d="M 26 22 L 66 22 L 64 36 L 22 36 Z" fill="#ffffff" opacity="0.9" />
    <!-- Van Main Body -->
    <rect x="8" y="38" width="76" height="26" rx="6" fill="#ffffff" />
    <!-- Side Orange Accent Stripe -->
    <rect x="8" y="48" width="76" height="5" fill="url(#orangeGrad)" />
    <!-- Front Grill / Headlights -->
    <circle cx="18" cy="44" r="3.5" fill="#f05a28" />
    <circle cx="74" cy="44" r="3.5" fill="#f05a28" />
    <rect x="30" y="42" width="32" height="4" rx="2" fill="#0a305e" opacity="0.7" />
    <!-- Wheels -->
    <circle cx="24" cy="64" r="8" fill="#1e293b" />
    <circle cx="24" cy="64" r="4" fill="#94a3b8" />
    <circle cx="68" cy="64" r="8" fill="#1e293b" />
    <circle cx="68" cy="64" r="4" fill="#94a3b8" />
  </g>

  <!-- Prominent "QT" Text Emblem in Foreground -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="-1">
    <text x="64" y="112" text-anchor="middle" fill="#ffffff">QUICK<tspan fill="#f05a28">TRAVEL</tspan></text>
  </g>
</svg>
